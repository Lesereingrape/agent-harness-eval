[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ahe"
version = "0.1.0"
description = "Agent Harness Eval: instrument, score, and statistically compare agent rollouts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Shuang Leng" }]
dependencies = []

[project.optional-dependencies]
http = ["httpx>=0.27"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ahe = "ahe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
